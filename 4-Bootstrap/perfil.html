<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>Componente de perfil</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <link href="perfil.css" rel="stylesheet">
    </head>

    <body>
        <main class="container my-5">
            <h1 class="visually-hidden">Componente de perfil</h1>

            <div class="d-flex justify-content-center">
                <article
                    class="card perfil-card"
                    aria-labelledby="nombre-perfil"
                >
                    <!-- Imagen de portada -->
                    <img
                        src="imagenes/portada.jpg"
                        class="card-img-top perfil-portada"
                        alt="Portada del perfil"
                    >

                    <!-- Foto y datos personales -->
                    <div class="card-body text-center pt-0">
                        <img
                            src="imagenes/perfil.png"
                            class="perfil-avatar rounded-circle border border-3 border-white bg-white"
                            alt="Foto de Agustina Aliciardi"
                        >

                        <h2
                            id="nombre-perfil"
                            class="card-title fs-5 fw-bold mt-2"
                        >
                            Emi Garcia
                        </h2>

                        <p class="card-text text-secondary">
                            Lorem ipsum dolor sit amet, consectetur
                            adipiscing elit. In pulvinar lacus risus,
                            et convallis ante sodales eget. Nulla ornare
                            dui non tellus varius tincidunt.
                        </p>

                        <button type="button" class="btn btn-primary">
                            Ver perfil
                        </button>
                    </div>

                    <!-- Opciones del perfil -->
                    <div class="list-group list-group-flush">
                        <button
                            type="button"
                            class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                        >
                            <svg
                                class="perfil-icono"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path d="M4 4h16v12H8l-4 4V4z"></path>
                                <path d="M8 8h8M8 12h6"></path>
                            </svg>

                            <span>Ir a mensajes</span>
                        </button>

                        <button
                            type="button"
                            class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                        >
                            <svg
                                class="perfil-icono"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M6 10a6 6 0 0 1 12 0v5l2 3H4l2-3v-5z"
                                ></path>
                                <path d="M10 21h4M12 2v2"></path>
                            </svg>

                            <span>Notificaciones</span>

                            <span class="badge bg-danger">
                                +99
                                <span class="visually-hidden">
                                    notificaciones pendientes
                                </span>
                            </span>
                        </button>

                        <button
                            type="button"
                            class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                        >
                            <svg
                                class="perfil-icono"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <circle cx="9" cy="7" r="3"></circle>
                                <path
                                    d="M3 20v-2a6 6 0 0 1 12 0v2H3z"
                                ></path>
                                <path
                                    d="M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2h-3"
                                ></path>
                            </svg>

                            <span>Solicitudes pendientes</span>
                        </button>

                        <button
                            type="button"
                            class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                        >
                            <svg
                                class="perfil-icono"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <rect
                                    x="3"
                                    y="5"
                                    width="12"
                                    height="14"
                                    rx="2"
                                ></rect>
                                <path d="M15 9l6-3v12l-6-3"></path>
                            </svg>

                            <span>Llamar</span>
                        </button>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>

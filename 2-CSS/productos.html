<!DOCTYPE html>
<html>
    <head>
        <title>Catálogo de Productos</title>
        <link href="catalogo.css" type="text/css" rel="stylesheet">
    </head>
    <body class="grid-container">
        <header class="item_1">
            Catalogo de Productos
        </header>

        <nav class="item_2">
            <a href="productos.html">Catalogo de Productos</a>
            <a href="carrito.html">Carrito de Compras</a>
        </nav>

        <aside class="item_3">
            <form name="filtros" id="filtrer">
                <fieldset>
                    <legend>Buscador</legend>
                    <label for="search">Buscar:</label>
                    <input type="text" id="search" name="search" placeholder="Buscar productos...">
                </fieldset>
                <fieldset>
                    <legend>Precios</legend>
                    <p>
                        <label for="price-min">Minimo:</label>
                        <input type="number" id="price-min" name="price-min" min="0">
                    </p>
                    <p>
                        <label for="price-max">Maximo:</label>
                        <input type="number" id="price-max" name="price-max" min="0">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Tipo de Productos</legend>
                    <p>
                        <input type="checkbox" id="protectores" name="tipo" value="protectores">
                        <label for="protectores">Protectores</label>
                    </p>
                    <p>
                        <input type="checkbox" id="entrenamiento" name="tipo" value="entrenamiento">
                        <label for="entrenamiento">Entrenamiento</label>
                    </p>
                    <p>
                        <input type="checkbox" id="dobok" name="tipo" value="dobok">
                        <label for="dobok">Dobok</label>
                    </p>
                </fieldset>
            </form>
        </aside>

        <main class="item_4">
            <div> 
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp" alt="Cabezales cerrados">
                <h3>Cabezal Cerrado</h3>
            </div>

            <div> 
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" alt="Dobok">
                <h3>Dobok</h3>
            </div>

            <div> 
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp" alt="Escudo de potencia">
                <h3>Escudo de Potencia</h3>
            </div>

            <div> 
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" alt="Foco con Dedos">
                <h3>Foco con Dedos</h3>
            </div>

            <div> 
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Protectores de Manos">
                <h3>Protectores de Manos</h3>
            </div>

            <div> 
                <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-pie.webp" alt="Protectores de Pies">
                <h3>Protectores de Pies</h3>
            </div>
        </main>

        <footer class="item_5">
            Contacto
        </footer>
    </body>
</html>

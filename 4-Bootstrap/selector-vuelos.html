<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Selección de fechas de vuelos</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <link href="vuelos.css" rel="stylesheet">

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            defer
        ></script>

        <script src="vuelos.js" defer></script>
    </head>

    <body>
        <main class="container my-5">
            <div class="dropdown">
                <button
                    class="btn btn-primary dropdown-toggle"
                    type="button"
                    id="selector-fechas"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    aria-expanded="false"
                >
                    Seleccioná la fecha
                </button>

                <div class="dropdown-menu p-4 shadow calendar-container">
                    <h1 class="h4 text-center mb-4">
                        Fechas de Vuelos
                    </h1>

                    <div
                        class="d-flex justify-content-between align-items-center mb-3"
                    >
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="cambiarMes(-1)"
                            aria-label="Mes anterior"
                        >
                            &#10094;
                        </button>

                        <span class="text-secondary small">
                            Seleccioná ida y vuelta
                        </span>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="cambiarMes(1)"
                            aria-label="Mes siguiente"
                        >
                            &#10095;
                        </button>
                    </div>

                    <div class="row g-0">
                        <section
                            class="col-12 col-md-6 pe-md-3 calendar-first"
                            aria-labelledby="titulo-mes-0"
                        >
                            <h2
                                id="titulo-mes-0"
                                class="fs-6 fw-bold text-center mb-3"
                            ></h2>

                            <div
                                id="calendario-0"
                                class="calendar-grid"
                            ></div>
                        </section>

                        <section
                            class="col-12 col-md-6 ps-md-3 mt-4 mt-md-0"
                            aria-labelledby="titulo-mes-1"
                        >
                            <h2
                                id="titulo-mes-1"
                                class="fs-6 fw-bold text-center mb-3"
                            ></h2>

                            <div
                                id="calendario-1"
                                class="calendar-grid"
                            ></div>
                        </section>
                    </div>

                    <p
                        id="estado-fechas"
                        class="text-secondary small mt-3"
                        aria-live="polite"
                    >
                        Seleccioná la fecha de ida.
                    </p>

                    <div class="d-flex justify-content-between gap-2">
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="cancelarSeleccion()"
                        >
                            Cancelar
                        </button>

                        <button
                            type="button"
                            id="guardar-fechas"
                            class="btn btn-outline-primary"
                            onclick="guardarSeleccion()"
                            disabled
                        >
                            Guardar
                        </button>
                    </div>
                </div>
            </div>

            <p id="resumen-vuelo" class="mt-3" aria-live="polite"></p>
        </main>
    </body>
</html>

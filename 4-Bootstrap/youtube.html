<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>Tarjetas de YouTube</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <link href="youtube.css" rel="stylesheet">
    </head>

    <body>
        <main class="container my-5">
            <h1 class="visually-hidden">Videos recomendados</h1>

            <div
                class="d-flex justify-content-center align-items-start flex-wrap gap-3"
            >
                <!-- Primera tarjeta -->
                <article
                    class="card text-bg-dark border-0 video-card"
                    aria-labelledby="titulo-video-1"
                >
                    <img
                        src="imagenes/miniatura.jpg"
                        class="card-img-top video-miniatura"
                        alt="Miniatura del ejercicio de carrito de compras"
                    >

                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-2">
                                <img
                                    src="imagenes/avatar.png"
                                    class="rounded-circle canal-avatar"
                                    alt="Avatar del canal"
                                >
                            </div>

                            <div class="col-10">
                                <h2
                                    id="titulo-video-1"
                                    class="fs-6 fw-bold mb-2"
                                >
                                    <a
                                        href="https://www.youtube.com/watch?v=Ln7tgVrHuSw"
                                        class="text-white text-decoration-none"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        Taller de Desarrollo Web -
                                        Vaciar Carrito y Eliminar Producto
                                    </a>
                                </h2>

                                <p class="text-light opacity-50 small mb-0">
                                    Taller de Desarrollo Web - Otro Ejercicio
                                </p>

                                <p class="text-light opacity-50 small mb-0">
                                    230 vistas · 1 día
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons overflow-hidden">
                        <div class="row g-0 px-2 pb-2">
                            <div class="col-6 p-1">
                                <button
                                    type="button"
                                    class="btn text-secondary w-100 action-button"
                                >
                                    VER MÁS TARDE
                                </button>
                            </div>

                            <div class="col-6 p-1">
                                <button
                                    type="button"
                                    class="btn text-secondary w-100 action-button"
                                >
                                    AGREGAR A LA FILA
                                </button>
                            </div>
                        </div>
                    </div>
                </article>

                <!-- Segunda tarjeta -->
                <article
                    class="card text-bg-dark border-0 video-card"
                    aria-labelledby="titulo-video-2"
                >
                    <img
                        src="imagenes/miniatura.jpg"
                        class="card-img-top video-miniatura"
                        alt="Miniatura del ejercicio de filtros de productos"
                    >

                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-2">
                                <img
                                    src="imagenes/avatar.png"
                                    class="rounded-circle canal-avatar"
                                    alt="Avatar del canal"
                                >
                            </div>

                            <div class="col-10">
                                <h2
                                    id="titulo-video-2"
                                    class="fs-6 fw-bold mb-2"
                                >
                                    <a
                                        href="https://www.youtube.com/watch?v=VqFQqsjN_yc"
                                        class="text-white text-decoration-none"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        Taller de Desarrollo Web -
                                        Aplicar Filtros en el Catálogo
                                    </a>
                                </h2>

                                <p class="text-light opacity-50 small mb-0">
                                    Taller de Desarrollo Web - Otro Ejercicio
                                </p>

                                <p class="text-light opacity-50 small mb-0">
                                    230 vistas · 1 día
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons overflow-hidden">
                        <div class="row g-0 px-2 pb-2">
                            <div class="col-6 p-1">
                                <button
                                    type="button"
                                    class="btn text-secondary w-100 action-button"
                                >
                                    VER MÁS TARDE
                                </button>
                            </div>

                            <div class="col-6 p-1">
                                <button
                                    type="button"
                                    class="btn text-secondary w-100 action-button"
                                >
                                    AGREGAR A LA FILA
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>
